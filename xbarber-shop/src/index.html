<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; connect-src 'self'; object-src 'none'; base-uri 'self';">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="XOSHAWI STUDIO">
    <meta name="theme-color" content="#0b0b0b">
    <title>XOSHAWI STUDIO</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="css/style.css?v=2026.11.07.3">
    <link rel="icon" href="../assets/logo/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="../assets/logo/apple-touch-icon.png">
</head>
<body>
    <div id="app">
        <section id="login-screen" class="login-screen">
            <div class="login-lang lang-switch" data-lang-switch role="group"></div>
            <form id="login-form" class="login-card" autocomplete="on">
                <div class="login-logo"><img src="../assets/logo/logo.png" alt=""></div>
                <h1 data-shop-name>XOSHAWI STUDIO</h1>
                <p class="login-subtitle" data-i18n="login.subtitle">Cashier · Clients · Products</p>
                <label class="field">
                    <span data-i18n="login.username">Username</span>
                    <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </label>
                <label class="field">
                    <span data-i18n="login.password">Password</span>
                    <input type="password" id="password" autocomplete="current-password" required>
                </label>
                <button type="submit" class="btn btn-primary btn-lg btn-block" data-i18n="login.submit">Sign in</button>
            </form>
        </section>

        <section id="main-app" class="app-shell" hidden>
            <nav id="nav" class="nav" aria-label="Main"></nav>
            <main class="main">
                <header class="topbar">
                    <div class="topbar-title">
                        <h1 id="page-title"></h1>
                        <p id="page-subtitle"></p>
                    </div>
                    <div class="topbar-lang lang-switch" data-lang-switch role="group"></div>
                    <div id="page-actions" class="topbar-actions"></div>
                </header>
                <div id="page" class="page"></div>
            </main>
        </section>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <div id="offline-status" role="status" aria-live="polite" data-state="checking">Checking connection…</div>

    <script src="../vendor/sql-wasm.js"></script>
    <script src="js/i18n.js?v=2026.11.07.3"></script>
    <script src="js/auth.js?v=2026.11.07.3"></script>
    <script src="js/web-api.js?v=2026.11.07.3"></script>
    <script src="js/slots.js?v=2026.11.07.3"></script>
    <script src="js/app.js?v=2026.11.07.3"></script>
</body>
</html>
