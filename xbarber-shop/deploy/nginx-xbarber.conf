# nginx in front of XBARBER SHOP. One address for everything:
#   https://YOUR_DOMAIN/          booking website ("Staff sign-in" in its footer opens the cashier)
#   https://YOUR_DOMAIN/cashier   cashier
# Install: see docs/VPS-SETUP.md. It is copied to /etc/nginx/sites-available/xbarber and
# YOUR_DOMAIN is replaced there (for example xbarber.duckdns.org). Other sites on this
# nginx (another project) are not touched. certbot adds https to this file afterwards.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Restoring a backup uploads the whole database file.
    client_max_body_size 200m;

    location / {
        # The port in deploy/xbarber.service (XBARBER_PORT).
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The server uses these for the visitor's address (booking limits) and for https cookies.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
